name: "💡 Feature Request / 新功能提案"
description: "建议新功能、改进现有框架工具、生命周期状态机或增强 CLI"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 learn-model-framework 构思新特性！
        请详细描述你遇到的业务痛点以及建议的解决方案。

  - type: textarea
    id: problem
    attributes:
      label: "核心痛点与业务场景 (Problem & Use Case)"
      description: "该特性试图解决什么问题？在怎样的水务/工业模型开发或实验场景下会出现？"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "建议的解决方案与设计规范 (Proposed Solution & API Design)"
      description: "清晰描述你期望的实现方式（包含建议的 CLI 命令、函数接口、配置文件字段或 ADR 方向）"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的替代方案 (Alternatives Considered)"
      description: "你是否尝试过其他替代方案或变通方法 (Workaround)？为什么现有方式不够理想？"

  - type: dropdown
    id: contribution
    attributes:
      label: "参与意愿 (Contribution Willingness)"
      description: "你是否愿意提交 Pull Request 亲自参与此功能的开发与测试？"
      options:
        - "是，我愿意提交 PR 实现此特性 (I would like to submit a PR)"
        - "如果能得到维护者的方案指导，我愿意尝试 (I can try with guidance)"
        - "目前仅提出想法，暂无时间实现 (Idea only for now)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "前置确认 (Checklist)"
      options:
        - label: "我已查阅项目文档与现有 ADR，确认该提案契合通用模型实验室脚手架定位。"
          required: true
        - label: "我已在 Issue 中检索过，未发现相同或高度重合的在讨论提案。"
          required: true
