<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="framework-arch-title framework-arch-desc" id="framework-architecture-and-lifecycle-root">
        <title id="framework-arch-title">水务模型框架双运行时解耦与质量门禁全景架构</title>
        <desc id="framework-arch-desc">架构图展示本地 Windows 控制面生成规格并驱动开发，Linux WSL 环境构建独立 MLflow 实包并通过预测验证，最终交由四道硬门禁与双轴审查，经授权向生产发布。</desc>

        <defs>
      <style>#framework-architecture-and-lifecycle-root { --color-paper:       #f5f5f5;
      --color-paper-2:     #ececec;
      --color-ink:         #2d3142;
      --color-ink-strong:  #111111;
      --color-muted:       #4f5d75;
      --color-soft:        #5a6580;
      --color-rule:        rgba(45,49,66,0.12);
      --color-rule-solid:  #bfc0c0;
      --color-accent:      #bf4520;
      --color-accent-tint: rgba(191,69,32,0.08);
      --color-link:        #2e5aa8;
      --font-sans:   'Geist', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Serif SC', 'Times New Roman', serif;
      --font-mono:   'Geist Mono', ui-monospace, 'Consolas', monospace; }
      #framework-architecture-and-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #framework-architecture-and-lifecycle-root .container { max-width: 1200px;
      margin: 0 auto; }
      #framework-architecture-and-lifecycle-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.6rem; }
      #framework-architecture-and-lifecycle-root .subtitle { font-family: var(--font-sans);
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 68ch; }
      #framework-architecture-and-lifecycle-root .diagram-scroll { width: 100%;
      overflow-x: auto;
      margin-bottom: 2.5rem;
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1rem 0.5rem; }
      #framework-architecture-and-lifecycle-root .cards-grid { display: grid;
      grid-template-columns: 1.15fr 1fr 0.95fr;
      gap: 1.25rem;
      margin-bottom: 2.5rem; }
      #framework-architecture-and-lifecycle-root .cards-grid { grid-template-columns: 1fr; }
      #framework-architecture-and-lifecycle-root .card-eyebrow { font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem; }</style>
          <pattern id="framework-architecture-and-lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse">
