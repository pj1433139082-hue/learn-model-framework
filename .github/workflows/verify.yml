name: framework checks
on:
  push:
  pull_request:
jobs:
  python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize the framework Python 3.11 environment
        run: bash scripts/bootstrap.sh --models-root "$RUNNER_TEMP/model-lab-private"
      - run: bash scripts/model-lab.sh doctor
      - run: bash scripts/model-lab.sh test-profile local
      - run: bash scripts/model-lab.sh release-gate
