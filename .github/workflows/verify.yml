name: framework checks
on:
  push:
  pull_request:
jobs:
  python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m model_lab doctor
      - run: python -m model_lab test-profile local
      - run: python -m model_lab release-gate
